services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: laf_maintenance
      POSTGRES_USER: laf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laf -d laf_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
